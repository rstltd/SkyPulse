# SkyPulse Apache Reverse Proxy Configuration
# Required modules: mod_proxy, mod_proxy_http, mod_ssl, mod_headers, mod_ratelimit

# HTTP → HTTPS redirect
<VirtualHost *:80>
    ServerName skypulse.example.com

    # Let's Encrypt challenge
    Alias /.well-known/acme-challenge/ /var/www/certbot/.well-known/acme-challenge/
    <Directory "/var/www/certbot">
        AllowOverride None
        Require all granted
    </Directory>

    # Redirect everything else to HTTPS
    RewriteEngine On
    RewriteCond %{REQUEST_URI} !^/.well-known/acme-challenge/
    RewriteRule ^(.*)$ https://%{HTTP_HOST}$1 [R=301,L]
</VirtualHost>

# HTTPS
<VirtualHost *:443>
    ServerName skypulse.example.com

    # SSL (replace with your certificate paths)
    SSLEngine on
    SSLCertificateFile /etc/apache2/certs/fullchain.pem
    SSLCertificateKeyFile /etc/apache2/certs/privkey.pem

    # SSL hardening
    SSLProtocol all -SSLv3 -TLSv1 -TLSv1.1
    SSLCipherSuite ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384
    SSLHonorCipherOrder on

    # Security headers
    Header always set X-Frame-Options DENY
    Header always set X-Content-Type-Options nosniff
    Header always set X-XSS-Protection "1; mode=block"
    Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"

    # Reverse proxy to Spring Boot
    ProxyPreserveHost On
    ProxyPass / http://skypulse:8080/
    ProxyPassReverse / http://skypulse:8080/

    # Forward real client IP
    RequestHeader set X-Forwarded-For "%{REMOTE_ADDR}e"
    RequestHeader set X-Forwarded-Proto "https"

    # Timeouts
    ProxyTimeout 60
    # Backfill may take longer
    <Location /api/v1/backfill>
        ProxyTimeout 300
    </Location>

    # Rate limiting for API (requires mod_ratelimit)
    <Location /api/v1>
        SetOutputFilter RATE_LIMIT
        SetEnv rate-limit 2000
    </Location>

    # Logging
    ErrorLog ${APACHE_LOG_DIR}/skypulse_error.log
    CustomLog ${APACHE_LOG_DIR}/skypulse_access.log combined
</VirtualHost>
