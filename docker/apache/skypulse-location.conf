# ============================================================
# SkyPulse — 掛載到公司既有 Apache 的設定片段
# 將此檔案 Include 到公司 Apache 的 VirtualHost 區塊中
#
# 使用方式：
#   <VirtualHost *:443>
#       ServerName company.com
#       ...
#       Include /etc/apache2/conf-available/skypulse-location.conf
#   </VirtualHost>
#
# 必要模組：mod_proxy, mod_proxy_http
#   a2enmod proxy proxy_http headers
#
# 存取路徑：https://company.com/skypulse/
# ============================================================

ProxyPreserveHost On

ProxyPass /skypulse/ http://skypulse-host:8080/skypulse/
ProxyPassReverse /skypulse/ http://skypulse-host:8080/skypulse/

<Location /skypulse/>
    RequestHeader set X-Forwarded-For "%{REMOTE_ADDR}e"
    RequestHeader set X-Forwarded-Proto "https"
</Location>

# Backfill: longer timeout
<Location /skypulse/api/v1/backfill>
    ProxyTimeout 300
</Location>
