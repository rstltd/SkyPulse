# Production with Apache reverse proxy
# Usage: docker compose -f docker-compose.apache.yml up -d --build
#
# Before starting:
# 1. Place SSL certificates in docker/apache/certs/
#    - fullchain.pem (certificate + chain)
#    - privkey.pem   (private key)
# 2. Set environment variables in docker/.env

services:
  apache:
    image: httpd:alpine
    container_name: skypulse-apache
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./apache/skypulse.conf:/usr/local/apache2/conf/extra/skypulse.conf:ro
      - ./apache/certs:/etc/apache2/certs:ro
    command: >
      sh -c "
        echo 'Include conf/extra/skypulse.conf' >> /usr/local/apache2/conf/httpd.conf &&
        echo 'LoadModule proxy_module modules/mod_proxy.so' >> /usr/local/apache2/conf/httpd.conf &&
        echo 'LoadModule proxy_http_module modules/mod_proxy_http.so' >> /usr/local/apache2/conf/httpd.conf &&
        echo 'LoadModule ssl_module modules/mod_ssl.so' >> /usr/local/apache2/conf/httpd.conf &&
        echo 'LoadModule headers_module modules/mod_headers.so' >> /usr/local/apache2/conf/httpd.conf &&
        echo 'LoadModule rewrite_module modules/mod_rewrite.so' >> /usr/local/apache2/conf/httpd.conf &&
        httpd-foreground
      "
    depends_on:
      - skypulse

  postgres:
    image: timescale/timescaledb:latest-pg16
    container_name: skypulse-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: skypulse
      POSTGRES_USER: skypulse
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init-db:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U skypulse"]
      interval: 10s
      timeout: 5s
      retries: 5

  skypulse:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: skypulse-app
    restart: unless-stopped
    expose:
      - "8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/skypulse
      SPRING_DATASOURCE_USERNAME: skypulse
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      CWA_API_KEY: ${CWA_API_KEY:?CWA_API_KEY is required}
      SKYPULSE_API_KEY: ${SKYPULSE_API_KEY:?SKYPULSE_API_KEY is required}
      SKYPULSE_ADMIN_KEY: ${SKYPULSE_ADMIN_KEY:?SKYPULSE_ADMIN_KEY is required}
      SKYPULSE_CORS_ORIGINS: ${SKYPULSE_CORS_ORIGINS:-https://skypulse.example.com}
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
