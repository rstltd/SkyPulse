services:
  postgres:
    image: timescale/timescaledb:latest-pg16
    container_name: skypulse-db
    restart: unless-stopped
    # Cap container memory so the JVM + Postgres cannot exhaust a small Raspberry Pi and
    # trigger the OOM killer. Tune to the target RAM via SKYPULSE_DB_MEM_LIMIT / SKYPULSE_APP_MEM_LIMIT
    # (dev on docker-compose.yml is intentionally uncapped — the dev machine has ample RAM).
    mem_limit: ${SKYPULSE_DB_MEM_LIMIT:-1g}
    # No ports exposed — database only accessible from app container via Docker network
    environment:
      POSTGRES_DB: skypulse
      POSTGRES_USER: skypulse
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init-db:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U skypulse"]
      interval: 10s
      timeout: 5s
      retries: 5

  skypulse:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: skypulse-app
    restart: unless-stopped
    mem_limit: ${SKYPULSE_APP_MEM_LIMIT:-1500m}
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/skypulse
      SPRING_DATASOURCE_USERNAME: skypulse
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      CWA_API_KEY: ${CWA_API_KEY:?CWA_API_KEY is required}
      SKYPULSE_API_KEY: ${SKYPULSE_API_KEY:?SKYPULSE_API_KEY is required}
      SKYPULSE_ADMIN_KEY: ${SKYPULSE_ADMIN_KEY:?SKYPULSE_ADMIN_KEY is required}
      SKYPULSE_LOGIN_PASSWORD: ${SKYPULSE_LOGIN_PASSWORD:?SKYPULSE_LOGIN_PASSWORD is required}
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
