# ============================================================
# SkyPulse — 掛載到公司既有 Nginx 的設定片段
# 將此檔案 include 到公司 Nginx 的 server {} 區塊中
#
# 使用方式：
#   server {
#       listen 443 ssl;
#       server_name company.com;
#       ...
#       include /etc/nginx/conf.d/skypulse-location.conf;
#   }
#
# 存取路徑：https://company.com/skypulse/
# ============================================================

location /skypulse/ {
    proxy_pass http://skypulse-host:8080/skypulse/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_connect_timeout 10s;
    proxy_read_timeout 60s;
    proxy_send_timeout 30s;
}

# Backfill: longer timeout
location /skypulse/api/v1/backfill/ {
    proxy_pass http://skypulse-host:8080/skypulse/api/v1/backfill/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_read_timeout 300s;
}
