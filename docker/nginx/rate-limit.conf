# Rate limiting zones — include this in the http {} block of nginx main config
# Usage: include /etc/nginx/conf.d/rate-limit.conf;

# API endpoints: 30 requests/second per IP
limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;

# Backfill endpoints: 1 request/minute per IP
limit_req_zone $binary_remote_addr zone=backfill:10m rate=1r/m;

# Custom 429 response
limit_req_status 429;
