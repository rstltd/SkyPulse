spring:
  datasource:
    url: jdbc:postgresql://localhost:5433/skypulse_test
    username: skypulse
    password: skypulse_test
  flyway:
    enabled: true
  jpa:
    hibernate:
      ddl-auto: validate

server:
  servlet:
    context-path: /skypulse

skypulse:
  cwa:
    api-key: test-key
  backfill:
    enabled: false
  collectors:
    # Keep tests offline + deterministic: no live reference-data fetch/write at context load.
    eager-startup-load: false
  security:
    api-key: test-api-key
    admin-key: test-admin-key
